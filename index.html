<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Montre de Merlin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Concept : un appareil unique, centré. Accueil bleu-vert comme la capture de référence, applications nuit-violet,
   manuscrit sur parchemin. Les données (sorts, potions, planètes) vivent dans le script, section DATA. */
:root{
  --stage:#0a0816;
  --night:#0f0c24; --night-2:#1b1640; --night-3:#2a2260;
  --violet:#7b5fd0; --violet-soft:#a794ec;
  --gold:#e8b94c; --gold-soft:#f3d98b;
  --text:#f2eefc; --muted:#b4abd3; --line:rgba(255,255,255,.14);
  --parch:#e6d6b2; --parch-2:#d6c196; --ink:#3a2a1a; --ink-soft:#6a553d; --oxblood:#4a1f1f;
  --danger:#ea7377; --ok:#6fd0a2;
  --teal-1:#2e8aa6; --teal-2:#4f98a8; --teal-3:#6f9fa9;
  --f-ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-title:"Cormorant SC","Palatino Linotype",Georgia,serif;
  --f-manu:"IM Fell English",Georgia,"Times New Roman",serif;
  --f-manu-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:grid; grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1fr); place-items:center; color:var(--text); font:15px/1.45 var(--f-ui);
  background:radial-gradient(ellipse at 50% 30%,#1a1440 0%,var(--stage) 62%);
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- appareil ---------- */
.device{position:relative;width:min(430px,100%);height:100%;max-height:880px;min-height:0;padding:10px;border-radius:46px;
  background:linear-gradient(145deg,#1d1736,#07050f);
  box-shadow:0 0 0 2px rgba(232,185,76,.4),0 0 0 5px #0d0a1c,0 28px 80px rgba(0,0,0,.65)}
@media (min-width:900px) and (min-height:640px){.device{width:min(520px,100%)}}
.crown{position:absolute;right:-9px;top:26%;width:10px;height:58px;border-radius:0 6px 6px 0;
  background:linear-gradient(90deg,#8a6a22,var(--gold) 55%,#a37d2a);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.crown:hover{filter:brightness(1.15)}
.stage{position:relative;width:100%;height:100%;overflow:hidden;border-radius:36px;background:var(--night);container-type:inline-size;isolation:isolate}
#view{position:absolute;inset:0}
.homebar{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:128px;height:24px;z-index:30;display:grid;place-items:center}
.homebar i{display:block;width:104px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.homebar:hover i{background:#fff}
@media (max-width:520px){.device{padding:6px;border-radius:38px}.stage{border-radius:32px}.crown{right:-7px;width:8px}}

/* ---------- écrans ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;animation:scrIn .28s ease both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.scr-planet{animation:zoomIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes zoomIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.calm *,.calm{animation-duration:.001s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:16px 20px 4px;flex:none}
.bar-l{display:flex;flex-direction:column;line-height:1.2;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.bar-l b{font-weight:600}
.bar-r{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;flex:none}
.appbar h1{margin:0;font:600 18px/1.15 var(--f-ui);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ibtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none;font-size:18px}
.ibtn:hover{background:rgba(255,255,255,.16)}
.ibtn svg{width:20px;height:20px}
.tbtn{height:36px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px;font-weight:500;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;
  background:linear-gradient(180deg,#f0c75a,#d6a032);color:#2a1d05}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text)}
.btn.danger{background:rgba(234,115,119,.18);color:#ffb3b5;border:1px solid rgba(234,115,119,.5)}
.btn.block{width:100%}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 44px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:500;background:rgba(255,255,255,.1);color:var(--text);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c,#aaa)}
.pill.rp{background:rgba(232,185,76,.2);color:var(--gold-soft)}
.pill.canon{background:rgba(111,208,162,.16);color:#a8ecc8}
.unk{color:var(--muted);font-style:italic;margin:0}

/* ---------- profils ---------- */
.scr-profiles{background:radial-gradient(ellipse at 50% 0%,#33257a 0%,var(--night) 70%)}
.hero{padding:38px 22px 8px;text-align:center}
.hero h1{margin:0;font:600 34px/1.05 var(--f-title);letter-spacing:.03em;text-wrap:balance}
.hero p{margin:8px auto 0;color:var(--muted);max-width:30ch}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:18px 18px 40px;overflow-y:auto;align-content:start}
.pcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px 14px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .15s,background .15s}
.pcard:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.pcard[aria-current=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pcard b{font:600 20px/1 var(--f-title);letter-spacing:.04em}
.pcard span.sub{font-size:12px;color:var(--muted)}
.avatar{width:var(--s,76px);height:var(--s,76px);border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--uc) 55%,#fff),var(--uc));color:#1a1235;border:2px solid rgba(255,255,255,.55)}
.avatar svg{width:52%;height:52%}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- accueil ---------- */
.scr-home{background:radial-gradient(ellipse 90% 70% at 50% 58%,var(--teal-1) 0%,var(--teal-2) 48%,var(--teal-3) 100%)}
.scr-home .bar{padding:18px 22px 0}
.scr-home .bar-r{font-size:30px;font-weight:600;letter-spacing:.01em;line-height:1}
.scr-home .bar-l{font-size:13px;color:#eaf6f8}
.userchip{align-self:flex-start;margin:14px 20px 0;display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:rgba(10,20,40,.35);backdrop-filter:blur(6px);font-weight:600}
.userchip .avatar{--s:32px;border-width:1.5px}
.userchip small{font-weight:400;opacity:.75;font-size:12px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:20px 14px;padding:26px 22px 0;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.app:hover{transform:translateY(-2px) scale(1.04)}
.app svg{width:100%;max-width:68px;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.28))}
.gear{position:absolute;right:20px;bottom:42px;width:58px;height:58px;transition:transform .5s}
.gear:hover{transform:rotate(60deg)}
.gear svg{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.consts{position:absolute;left:0;bottom:30px;width:62%;max-width:260px;opacity:.28;pointer-events:none}

/* ---------- feuilles ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.sheet-bd{position:absolute;inset:0;background:rgba(5,3,14,.6);animation:fade .2s both}
.sheet{position:relative;width:100%;max-height:88%;display:flex;flex-direction:column;background:linear-gradient(#211a4f,#171238);border-radius:26px 26px 0 0;border-top:1px solid var(--line);animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.sheet.tall{height:88%}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 6px 20px;flex:none}
.sheet-head h2{margin:0;flex:1;font:600 22px/1.1 var(--f-title);letter-spacing:.03em;text-wrap:balance}
.x{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.1);font-size:22px;line-height:1}
.sheet-body{overflow-y:auto;padding:6px 20px 36px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-wrap.out .sheet{animation:down .18s ease both}.sheet-wrap.out .sheet-bd{animation:fadeOut .18s both}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes down{to{transform:translateY(100%)}}
.sec h3{margin:0 0 4px;font:600 12px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--gold-soft)}
.sec p{margin:0;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.incant{font:italic 500 21px/1.2 var(--f-manu);color:var(--gold-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* ---------- champs ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.in{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);outline:none}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:84px;resize:vertical}
select.in option{color:#111}
.search{position:relative;margin:2px 16px 8px}
.search input{padding-left:42px}
.search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);opacity:.7;pointer-events:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid transparent;font-size:13px;font-weight:500;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#aaa)}
.chip[aria-pressed=true]{background:rgba(232,185,76,.2);border-color:var(--gold);color:var(--gold-soft)}
.count{padding:0 20px 6px;font-size:12px;color:var(--muted);flex:none}

/* ---------- sorts ---------- */
.scr-spells{background:linear-gradient(#17123a,#0d0a20)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-content:start}
.card{position:relative;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px 8px 12px 14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--line);min-width:0;width:100%}
.card:hover{background:rgba(255,255,255,.12)}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.card .in2{font:italic 15px/1.2 var(--f-manu);color:var(--gold-soft);overflow-wrap:anywhere}
.star{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--muted)}
.star:hover{background:rgba(255,255,255,.1)}
.star[aria-pressed=true]{color:var(--gold)}
.star svg{width:20px;height:20px}
.fab{position:absolute;right:18px;bottom:44px;width:54px;height:54px;border-radius:18px;background:linear-gradient(180deg,#f0c75a,#d6a032);color:#2a1d05;font-size:30px;line-height:1;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:5}
.fab:hover{filter:brightness(1.1)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- manuscrit ---------- */
.scr-potions{--g:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .12 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");font-family:var(--f-manu)}
.scr-potions[data-mode=cover]{background:radial-gradient(ellipse at 50% 30%,#6a2a2a,var(--oxblood) 55%,#2a1010)}
.scr-potions[data-mode=index],.scr-potions[data-mode=page]{background:var(--g),radial-gradient(ellipse at 50% 40%,#ecdebb,var(--parch) 55%,var(--parch-2));color:var(--ink);box-shadow:inset 0 0 70px rgba(100,60,20,.4)}
.scr-potions .ibtn,.scr-potions .tbtn{background:rgba(58,42,26,.12);color:var(--ink)}
.scr-potions[data-mode=cover] .ibtn{background:rgba(255,255,255,.1);color:#f3d98b}
.scr-potions .appbar h1{font-family:var(--f-manu-sc);font-weight:400;letter-spacing:.04em;font-size:20px}
.scr-potions .appbar small{color:var(--ink-soft)}
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 30px 50px;text-align:center;color:var(--gold-soft)}
.cover .frame{width:100%;max-width:330px;padding:26px 18px 24px;border:2px solid var(--gold);outline:1px solid rgba(232,185,76,.5);outline-offset:6px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:14px;background:rgba(0,0,0,.14)}
.cover h2{margin:0;font:400 31px/1.05 var(--f-manu-sc);letter-spacing:.05em;text-wrap:balance}
.cover p{margin:0;font-style:italic;opacity:.85;max-width:26ch}
.cover svg{width:130px;height:130px}
.scr-potions .search input{background:rgba(58,42,26,.08);border-color:rgba(58,42,26,.3);color:var(--ink)}
.scr-potions .search input::placeholder{color:var(--ink-soft)}
.scr-potions .chip{background:rgba(58,42,26,.1);color:var(--ink);font-family:var(--f-ui)}
.scr-potions .chip[aria-pressed=true]{background:rgba(120,60,20,.2);border-color:#7a4a1f;color:#3a1d05}
.scr-potions .count{color:var(--ink-soft)}
.scr-potions .card{background:rgba(255,250,235,.45);border-color:rgba(58,42,26,.25)}
.scr-potions .card:hover{background:rgba(255,250,235,.8)}
.scr-potions .card .nm{font:400 18px/1.15 var(--f-manu-sc);letter-spacing:.02em}
.scr-potions .card .in2{color:var(--ink-soft);font-size:14px}
.scr-potions .pill{background:rgba(58,42,26,.12);color:var(--ink)}
.scr-potions .pill.rp{background:rgba(150,90,20,.22);color:#5a3208}
.scr-potions .pill.canon{background:rgba(40,100,70,.16);color:#1d4d37}
.scr-potions .star{color:var(--ink-soft)}.scr-potions .star[aria-pressed=true]{color:#a8650a}
.scr-potions .fab{background:linear-gradient(180deg,#8a3a2a,#5a1f18);color:#f3d98b}
.scr-potions .empty{color:var(--ink-soft)}
.flask{width:44px;height:50px;flex:none}
.page{padding:6px 24px 8px;display:flex;flex-direction:column;gap:14px;animation:turnR .35s ease both}
.page.l{animation-name:turnL}
@keyframes turnR{from{opacity:0;transform:translateX(26px) rotateY(-14deg)}to{opacity:1;transform:none}}
@keyframes turnL{from{opacity:0;transform:translateX(-26px) rotateY(14deg)}to{opacity:1;transform:none}}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ph h2{margin:0;font:400 30px/1.05 var(--f-manu-sc);letter-spacing:.04em;text-wrap:balance}
.ph .en{font-style:italic;color:var(--ink-soft);margin-top:-2px}
.ph svg.flask{width:62px;height:70px}
.orn{width:100%;max-width:240px;height:14px;color:#7a4a1f}
.psec h3{margin:0 0 4px;font:400 15px/1.2 var(--f-manu-sc);letter-spacing:.1em;color:#7a3a1a;border-bottom:1px solid rgba(122,58,26,.35);padding-bottom:3px}
.psec p,.psec li{font-size:17px;line-height:1.4;margin:0;text-wrap:pretty}
.psec ul,.psec ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.psec li small{color:var(--ink-soft);font-style:italic}
.psec .unk{color:var(--ink-soft)}
.scr-potions .row .pill{font-family:var(--f-ui)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 38px;flex:none;border-top:1px solid rgba(58,42,26,.25);font-size:14px}
.pnav .tbtn{background:rgba(58,42,26,.14);color:var(--ink)}
.pnav .tbtn:disabled{opacity:.35;cursor:default}
.pnav span{color:var(--ink-soft);font-style:italic}

/* ---------- carte spatiale ---------- */
.scr-map,.scr-planet{background:#120c2a}
.space,.pmap{position:relative;flex:1;min-height:0;overflow:hidden}
.space{background:
  radial-gradient(ellipse 55% 45% at 22% 55%,rgba(120,62,170,.75),transparent 70%),
  radial-gradient(ellipse 50% 40% at 50% 85%,rgba(214,100,140,.65),transparent 70%),
  radial-gradient(ellipse 60% 55% at 85% 70%,rgba(50,80,190,.7),transparent 70%),
  radial-gradient(ellipse 50% 40% at 62% 20%,rgba(150,80,190,.6),transparent 70%),
  linear-gradient(#1a1040,#251552)}
.stars{position:absolute;inset:0;width:100%;height:100%}
.pz{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.pz:active{cursor:grabbing}
.pzw{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.pzw svg{display:block}
.planet{cursor:pointer;transition:opacity .35s,transform .5s ease-in;transform-box:fill-box;transform-origin:center}
.planet .bob{animation:bob 7s ease-in-out infinite}
.planet:nth-of-type(2) .bob{animation-delay:-3s}
@keyframes bob{0%,100%{transform:translateY(-5px)}50%{transform:translateY(6px)}}
.planet .glow{opacity:.0;transition:opacity .2s}
.planet:hover .glow,.planet:focus-visible .glow{opacity:1}
.planet:focus-visible{outline:none}
.plbl{font-family:var(--f-ui);font-weight:700;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(20,8,50,.45);stroke-width:5px;stroke-linejoin:round}
.psub{font-family:var(--f-ui);font-weight:600;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(20,8,50,.45);stroke-width:4px;stroke-linejoin:round}
.opening .planet:not(.sel){opacity:0}
.opening .planet.sel{transform:scale(2.8);opacity:0;transition:transform .45s ease-in,opacity .4s .06s}
.zoomctl{position:absolute;right:12px;bottom:40px;display:flex;flex-direction:column;gap:8px;z-index:4}
.zoomctl button{width:42px;height:42px;border-radius:14px;background:rgba(15,10,36,.72);backdrop-filter:blur(6px);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.zoomctl button:hover{background:rgba(40,30,90,.9)}
.hint{position:absolute;left:12px;bottom:40px;max-width:60%;padding:7px 12px;border-radius:12px;background:rgba(15,10,36,.7);backdrop-filter:blur(6px);font-size:12px;color:var(--muted);pointer-events:none;z-index:3}
.pmap{background:#12303f}
.reg{fill:var(--rf,rgba(255,255,255,0));stroke:rgba(255,246,214,.75);stroke-width:1.6;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.reg.img:hover{fill:rgba(255,226,140,.22)}
.reg.drw:hover{filter:brightness(1.2)}
.reg.on{fill:rgba(232,185,76,.34);stroke:var(--gold-soft);stroke-dasharray:none;stroke-width:3}
.reg.drw.on{fill:var(--rf);filter:brightness(1.3)}
.reg:focus-visible{outline:none;stroke:#fff;stroke-width:3}
.rlbl{font-family:var(--f-ui);font-weight:600;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(8,12,25,.9);stroke-linejoin:round}
.poi{cursor:pointer}
.poi .dot{fill:var(--gold);stroke:#2a1d05}
.poi .hit{fill:transparent}
.poi:hover .dot{fill:#fff}
.poi:focus-visible{outline:none}
.poi:focus-visible .dot{fill:#fff}
.note{width:100%;min-height:96px;font-family:var(--f-manu);font-size:17px;padding:12px 14px;border-radius:14px;background:rgba(230,214,178,.12);border:1px solid rgba(232,185,76,.35);outline:none;resize:vertical;line-height:1.35}
.note:focus{border-color:var(--gold)}
.lst{display:flex;flex-direction:column;gap:8px}
.lst button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);width:100%}
.lst button:hover{background:rgba(255,255,255,.13)}
.lst button b{flex:1;font-weight:600}
.planet-ill{display:flex;gap:14px;align-items:center}
.planet-ill img{width:96px;height:96px;border-radius:50%;flex:none}

/* ---------- paramètres ---------- */
.scr-settings{background:linear-gradient(#17123a,#0d0a20)}
.group{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:12px}
.group h2{margin:0;font:600 12px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--gold-soft)}
.me{display:flex;align-items:center;gap:14px}
.me .avatar{--s:64px}
.me b{font:600 24px/1 var(--f-title);letter-spacing:.04em}
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.sym{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;border:1px solid transparent}
.sym svg{width:55%;height:55%}
.sym[aria-pressed=true]{border-color:var(--gold);background:rgba(232,185,76,.2);color:var(--gold-soft)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw button{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw button[aria-checked=true]{background:var(--violet)}
.sw button[aria-checked=true]::after{transform:translateX(20px)}
.small{font-size:13px;color:var(--muted);margin:0}
.msg{font-size:13px;color:var(--ok);min-height:1.2em;margin:0}

/* ---------- Dino Cristaux ---------- */
.scr-dino{background:linear-gradient(#10102a,#1d1448)}
.dprev{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.dprev canvas{width:112px;height:112px;border-radius:20px;background:rgba(255,255,255,.08);flex:none}
.dprev .ctrl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:10px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:8px}
.swt{aspect-ratio:1;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.swt[aria-pressed=true]{border-color:#fff}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.lv{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;gap:1px;border:1px solid var(--line)}
.lv:hover:not([disabled]){background:rgba(255,255,255,.18)}
.lv small{font-size:10px;color:var(--gold);letter-spacing:.04em;line-height:1}
.lv svg{width:14px;height:14px;opacity:.7}
.lv[disabled]{opacity:.45;cursor:default}
.dgame{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#0c0a22}
.dcv{position:relative;flex:1;min-height:0;touch-action:none}
.dcv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dhud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:14px 12px 8px;z-index:3;pointer-events:none}
.dhud>*{pointer-events:auto}
.dhud .ibtn{background:rgba(10,8,30,.55);width:38px;height:38px}
.hud-pill{padding:5px 12px;border-radius:99px;background:rgba(10,8,30,.6);backdrop-filter:blur(4px);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.dctl{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 14px 34px;flex:none;gap:10px;background:#0c0a22}
.dctl .grp{display:flex;gap:10px;align-items:flex-end}
.dbtn{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.dbtn.big{width:76px;height:76px;border-radius:26px}
.dbtn.on{background:rgba(232,185,76,.38)}
.dbtn svg{width:30px;height:30px}
.dover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,24,.68);z-index:6;padding:20px;animation:fade .2s both}
.dcard{width:min(320px,100%);padding:22px;border-radius:24px;background:linear-gradient(#2a2260,#1a1442);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;text-align:center}
.dcard h2{margin:0;font:600 26px/1.1 var(--f-title);letter-spacing:.03em}
.dstars{font-size:40px;letter-spacing:.12em;color:var(--gold);line-height:1}
.dstars .off{color:rgba(255,255,255,.2)}

/* ---------- petits écrans (montre) ---------- */
@container (max-width:300px){
  .scr-home .bar-r{font-size:24px}
  .apps{padding:16px 14px 0;gap:14px 10px;grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
  .hero h1{font-size:26px}
  .cards{grid-template-columns:1fr}
  .appbar h1{font-size:16px}
  .ph h2{font-size:24px}
}
@container (min-width:480px){
  .apps{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:24px 18px}
  .sheet{max-width:560px;margin:0 auto}
}

const KEY='montre-merlin-v1';

function defaults(){
  const users={};
  USERS.forEach(u=>users[u]={symbol:DEFAULT_SYMBOL[u],photo:null,favSpells:[],favPotions:[],notes:{},dino:{color:'#3fdc4a',res:{},all:false}});
  return {active:null,users,custom:{spells:[],potions:[]},calm:false};
}
function loadState(){
  let s=null;
  try{const r=localStorage.getItem(KEY);if(r)s=JSON.parse(r);}catch(e){}
  s=s||memState||defaults();
  const d=defaults();
  s.users=s.users||{};
  USERS.forEach(u=>{s.users[u]=Object.assign(d.users[u],s.users[u]||{});});
  s.custom=Object.assign(d.custom,s.custom||{});
  if(!USERS.includes(s.active))s.active=null;
  return s;
}

/* ---- feuilles (fenêtres du bas) ---- */
const sheets=[];
function openSheet(title,body,mount,opts={}){
  const wrap=el(`<div class="sheet-wrap"><div class="sheet-bd" data-close></div><div class="sheet${opts.tall?' tall':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="x" data-close aria-label="Fermer">×</button></div><div class="sheet-body">${body}</div></div></div>`);
  $('#stage').appendChild(wrap);
  const api={el:wrap,body:$('.sheet-body',wrap),onClose:opts.onClose,close(imm){
    const i=sheets.indexOf(api);if(i<0)return;sheets.splice(i,1);
    if(api.onClose)api.onClose();
    if(imm){wrap.remove();return;}
    wrap.classList.add('out');setTimeout(()=>wrap.remove(),190);
  }};
  wrap.addEventListener('click',e=>{if(e.target.closest('[data-close]'))api.close();});
  sheets.push(api);
  if(mount)mount(api);
  $('.x',wrap).focus({preventScroll:true});
  return api;
}
function closeSheets(imm){[...sheets].reverse().forEach(s=>s.close(imm));}
function twoStep(btn,confirmLabel,action){
  const base=btn.textContent;let armed=false,t;
  btn.addEventListener('click',()=>{
    if(!armed){armed=true;btn.textContent=confirmLabel;t=setTimeout(()=>{armed=false;btn.textContent=base;},3500);return;}
    clearTimeout(t);armed=false;btn.textContent=base;action();
  });
}

/* ---- zoom & déplacement ---- */
function panZoom(host,world,W,H,onChange){
  let s=1,tx=0,ty=0,fitS=1,moved=false,fitted=true,last=null;
  const ptr=new Map(),MAXMUL=10;
  const rect=()=>{const r=host.getBoundingClientRect();return {left:r.left,top:r.top,width:host.clientWidth,height:host.clientHeight};};
  function clamp(){const r=rect(),w=W*s,h=H*s;
    tx=w<=r.width?(r.width-w)/2:Math.min(0,Math.max(r.width-w,tx));
    ty=h<=r.height?(r.height-h)/2:Math.min(0,Math.max(r.height-h,ty));}
  function apply(){clamp();world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(onChange)onChange(s);}
  function fit(){const r=rect();if(!r.width)return;fitS=Math.min(r.width/W,r.height/H);s=fitS;tx=ty=0;fitted=true;apply();}
  function zoomAt(f,cx,cy){const ns=Math.min(fitS*MAXMUL,Math.max(fitS,s*f)),k=ns/s;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;s=ns;fitted=s<=fitS*1.001;apply();}
  function center(){const r=rect();return [r.width/2,r.height/2];}
  function onWheel(e){e.preventDefault();const r=rect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);}
  function onDown(e){ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(ptr.size===2){const [a,b]=[...ptr.values()];last={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};}}
  function onMove(e){const p=ptr.get(e.pointerId);if(!p)return;
    if(ptr.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(!moved&&Math.hypot(dx,dy)<5)return;
      moved=true;tx+=dx;ty+=dy;p.x=e.clientX;p.y=e.clientY;fitted=false;apply();}
    else if(ptr.size===2){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptr.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,r=rect();moved=true;
      if(last){tx+=cx-last.cx;ty+=cy-last.cy;zoomAt(d/last.d,cx-r.left,cy-r.top);}
      last={d,cx,cy};}}
  function onUp(e){ptr.delete(e.pointerId);if(ptr.size<2)last=null;}
  function onClick(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}}
  host.addEventListener('wheel',onWheel,{passive:false});
  host.addEventListener('pointerdown',onDown);
  host.addEventListener('click',onClick,true);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
  const ro=new ResizeObserver(()=>{const r=rect();if(!r.width)return;fitS=Math.min(r.width/W,r.height/H);if(fitted)fit();else{s=Math.max(s,fitS);apply();}});
  ro.observe(host);
  return {fit,
    zoomIn(){const [x,y]=center();zoomAt(1.5,x,y);},
    zoomOut(){const [x,y]=center();zoomAt(1/1.5,x,y);},
    focusOn(x,y,mul){const r=rect();const ns=Math.min(fitS*MAXMUL,Math.max(s,fitS*mul));s=ns;tx=r.width/2-x*ns;ty=r.height/2-y*ns;fitted=false;
      world.style.transition='transform .4s ease';apply();setTimeout(()=>{world.style.transition='';},450);},
    destroy(){ro.disconnect();host.removeEventListener('wheel',onWheel);host.removeEventListener('pointerdown',onDown);host.removeEventListener('click',onClick,true);
      window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onUp);}};
}

/* ---- horloge ---- */
const fT=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'});
const fW=new Intl.DateTimeFormat('fr-FR',{weekday:'long'});
const fD=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long'});
function tick(){
  const n=new Date(),t=fT.format(n),w=cap(fW.format(n)),d=fD.format(n);
  $$('[data-clock]').forEach(e=>{if(e.textContent!==t)e.textContent=t;});
  $$('[data-wd]').forEach(e=>{e.textContent=w;});
  $$('[data-dt]').forEach(e=>{e.textContent=d;});
}
setInterval(tick,1000);

   ===================================================================== */
const SCREENS={};

const view=$('#view'),device=$('#device');
function go(name,params){
  closeSheets(true);
  if(cur&&cur.cleanup)cur.cleanup();
  const node=el(`<section class="scr scr-${name}"></section>`);
  view.replaceChildren(node);
  cur={name,node,cleanup:null};
  cur.cleanup=SCREENS[name](node,params||{})||null;
  $('#homebar').hidden=(name==='home'||name==='profiles');
  device.classList.toggle('calm',!!state.calm);
  tick();
}
const goHome=()=>go(state.active?'home':'profiles');
$('#crown').addEventListener('click',goHome);
$('#homebar').addEventListener('click',goHome);
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-back]');
  if(b&&view.contains(b))go(b.dataset.back);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(sheets.length){sheets[sheets.length-1].close();return;}
  if(cur&&cur.node._esc){cur.node._esc();return;}
  if(cur&&cur.name==='planet')go('map');
  else if(cur&&!['home','profiles'].includes(cur.name))goHome();
});

function drawStars(cv,host){
  const r={width:host.clientWidth,height:host.clientHeight},dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const n=Math.round(r.width*r.height/1800);
  for(let i=0;i<n;i++){const x=rnd()*r.width,y=rnd()*r.height,big=rnd()>.93,rad=big?1.6+rnd()*1.6:.5+rnd()*.9;
    g.globalAlpha=.55+rnd()*.45;g.fillStyle='#fff';g.beginPath();g.arc(x,y,rad,0,7);g.fill();}
}
SCREENS.map=node=>{
  node.innerHTML=`${appbar('Carte spatiale',{sub:'Touche une planète pour l\'explorer'})}
  <div class="space" id="space"><canvas class="stars"></canvas><div class="pz" id="spz"><div class="pzw" id="spw"></div></div>
  <div class="zoomctl"><button id="zi" aria-label="Zoom avant">+</button><button id="zo" aria-label="Zoom arrière">−</button><button id="zr" aria-label="Recentrer">⌂</button></div></div>`;
  const host=$('#space',node),pz=$('#spz',node),w=$('#spw',node),cv=$('.stars',node);
  let lay=null,ctl=null,opening=false;
  function world(L){
    const S=SPACE[L],o=S.orbit;
    let s=`<svg viewBox="0 0 ${S.w} ${S.h}" width="${S.w}" height="${S.h}" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="glow"><stop offset=".55" stop-color="#ffe9a8" stop-opacity=".6"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="${o.cx}" cy="${o.cy}" rx="${o.rx}" ry="${o.ry}" transform="rotate(${o.rot} ${o.cx} ${o.cy})" fill="none" stroke="rgba(36,8,92,.78)" stroke-width="22" stroke-linecap="round"/>`;
    PLANETS.forEach(p=>{
      const q=p.space[L],lb=q.label,lh=lb.lh||lb.size*1.08;
      s+=`<g class="planet" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}, ${esc(p.subtitle)}">
        <g class="bob"><circle class="glow" cx="${q.x}" cy="${q.y}" r="${q.r*1.35}" fill="url(#glow)"/><image href="${IMG[p.sprite]}" x="${q.x-q.r}" y="${q.y-q.r}" width="${q.r*2}" height="${q.r*2}"/></g>
        ${lb.lines.map((t,i)=>`<text class="plbl" x="${lb.x}" y="${lb.y+i*lh}" font-size="${lb.size}" text-anchor="middle">${esc(t)}</text>`).join('')}
        <text class="psub" x="${lb.x}" y="${q.sub.y}" font-size="${q.sub.size}" text-anchor="middle">${esc(p.subtitle)}</text>
        <circle cx="${q.x}" cy="${q.y}" r="${q.r+22}" fill="transparent"/></g>`;
    });
    return s+'</svg>';
  }
  function mount(L){
    if(ctl)ctl.destroy();lay=L;w.innerHTML=world(L);w.style.width=SPACE[L].w+'px';w.style.height=SPACE[L].h+'px';
    ctl=panZoom(pz,w,SPACE[L].w,SPACE[L].h);
  }
  function open(g){
    if(opening)return;opening=true;node.classList.add('opening');g.classList.add('sel');
    setTimeout(()=>go('planet',{id:g.dataset.id}),420);
  }
  w.addEventListener('click',e=>{const g=e.target.closest('.planet');if(g)open(g);});
  w.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('planet')){e.preventDefault();open(e.target);}});
  $('#zi',node).addEventListener('click',()=>ctl.zoomIn());
  $('#zo',node).addEventListener('click',()=>ctl.zoomOut());
  $('#zr',node).addEventListener('click',()=>ctl.fit());
  const ro=new ResizeObserver(()=>{const r={width:host.clientWidth,height:host.clientHeight};if(!r.width)return;drawStars(cv,host);
    const L=r.width>=r.height?'landscape':'portrait';if(L!==lay)mount(L);});
  ro.observe(host);
  return ()=>{ro.disconnect();if(ctl)ctl.destroy();};
};

function centroid(poly){
  let a=0,cx=0,cy=0;
  for(let i=0;i<poly.length;i++){const [x0,y0]=poly[i],[x1,y1]=poly[(i+1)%poly.length],f=x0*y1-x1*y0;a+=f;cx+=(x0+x1)*f;cy+=(y0+y1)*f;}
  a/=2;return a?[cx/(6*a),cy/(6*a)]:poly[0];
}

SCREENS.planet=(node,{id})=>{
  const P=PLANETS.find(p=>p.id===id)||PLANETS[0],M=P.map;
  node.innerHTML=`${appbar(P.name,{back:'map',backLabel:'Retour à la carte spatiale',sub:P.subtitle,actions:[{id:'info',label:'Fiche'},{id:'regs',label:'Régions'}]})}
  <div class="pmap"><div class="pz" id="mpz"><div class="pzw" id="mw"></div></div>
  <div class="hint">Touche une région pour voir sa fiche.</div>
  <div class="zoomctl"><button id="zi" aria-label="Zoom avant">+</button><button id="zo" aria-label="Zoom arrière">−</button><button id="zr" aria-label="Recentrer">⌂</button></div></div>`;
  const pz=$('#mpz',node),w=$('#mw',node);
  const base=M.kind==='image'?`<image href="${IMG[M.src]}" width="${M.w}" height="${M.h}"/>`:drawnMap(P);
  const cls=M.kind==='image'?'img':'drw';
  let svg=`<svg viewBox="0 0 ${M.w} ${M.h}" width="${M.w}" height="${M.h}" xmlns="http://www.w3.org/2000/svg">${base}`;
  P.regions.forEach(r=>{svg+=`<polygon class="reg ${cls}" data-r="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)}" points="${r.poly.map(p=>p.join(',')).join(' ')}" ${r.fill?`style="--rf:${r.fill}"`:''}/>`;});
  P.regions.forEach(r=>{const c=r.lbl||centroid(r.poly);svg+=`<text class="rlbl" data-l x="${c[0].toFixed(1)}" y="${c[1].toFixed(1)}">${esc(r.name)}</text>`;});
  P.regions.forEach(r=>r.poi.forEach((p,i)=>{svg+=`<g class="poi" data-p="${r.id}:${i}" tabindex="0" role="button" aria-label="${esc(p.name)}"><circle class="hit" cx="${p.x}" cy="${p.y}" r="14"/><circle class="dot" cx="${p.x}" cy="${p.y}" r="5" stroke-width="1.5"/></g>`;}));
  w.innerHTML=svg+'</svg>';w.style.width=M.w+'px';w.style.height=M.h+'px';
  const labels=$$('[data-l]',w),dots=$$('.poi',w);
  function rescale(s){
    const k=1/s;
    labels.forEach(t=>{t.setAttribute('font-size',(12.5*k).toFixed(2));t.setAttribute('stroke-width',(3.2*k).toFixed(2));});
    dots.forEach(g=>{const [a,b]=g.children;a.setAttribute('r',(15*k).toFixed(2));b.setAttribute('r',(5*k).toFixed(2));b.setAttribute('stroke-width',(1.5*k).toFixed(2));});
  }
  const ctl=panZoom(pz,w,M.w,M.h,rescale);
  const region=id=>P.regions.find(r=>r.id===id);
  function mark(id){$$('.reg',w).forEach(p=>p.classList.toggle('on',p.dataset.r===id));}
  function poiSheet(key){
    const [rid,i]=key.split(':'),r=region(rid),p=r.poi[+i];
    openSheet(p.name,`<p class="small">${esc(r.name)} · ${esc(P.name)}</p><div class="sec"><h3>Description</h3><p>${esc(p.text||'À compléter.')}</p></div>`);
  }
  function regionSheet(id){
    const r=region(id);if(!r)return;mark(id);
    const key=P.id+':'+r.id;
    openSheet(r.name,`<div class="row"><span class="pill">${esc(r.kind)}</span>${r.provisional?'<span class="pill rp">Nom provisoire</span>':''}<span class="pill">${esc(P.name)}</span></div>
      <div class="sec"><h3>Description</h3><p>${esc(r.desc||'À compléter.')}</p></div>
      ${r.poi.length?`<div class="sec"><h3>Repères</h3><div class="lst">${r.poi.map((p,i)=>`<button data-p="${r.id}:${i}"><b>${esc(p.name)}</b><span class="small">Voir</span></button>`).join('')}</div></div>`:''}
      <div class="sec"><h3>Carnet de ${esc(state.active)}</h3><textarea class="note" id="nt" placeholder="Tes notes sur cette région…" aria-label="Notes sur ${esc(r.name)}">${esc(me().notes[key]||'')}</textarea><p class="msg" id="ntm"></p></div>
      <button class="btn ghost" id="cen">Centrer sur la carte</button>`,
    api=>{
      let t;const nt=$('#nt',api.el);
      nt.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{if(nt.value.trim())me().notes[key]=nt.value;else delete me().notes[key];save();$('#ntm',api.el).textContent='Enregistré.';},400);});
      $('#cen',api.el).addEventListener('click',()=>{api.close();const c=r.lbl||centroid(r.poly);ctl.focusOn(c[0],c[1],r.kind==='Glace'?1.6:2.6);});
      api.el.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)poiSheet(b.dataset.p);});
    },{onClose:()=>mark(null),tall:true});
  }
  function regionsList(){
    openSheet('Régions de '+P.name,`<div class="lst">${P.regions.map(r=>`<button data-r="${r.id}"><b>${esc(r.name)}</b><span class="pill">${esc(r.kind)}</span></button>`).join('')}</div>`,
    api=>api.el.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;api.close(true);regionSheet(b.dataset.r);}),{tall:true});
  }
  function info(){
    openSheet(P.name,`<div class="planet-ill"><img src="${IMG[P.sprite]}" alt="Illustration de ${esc(P.name)}"><div><div class="incant" style="font-family:var(--f-ui);font-style:normal;font-weight:600;font-size:17px">${esc(P.subtitle)}</div><p class="small">${P.regions.length} régions</p></div></div>
      <div class="sec"><h3>Description</h3><p>${esc(P.desc)}</p></div>
      <div class="sec"><h3>Informations</h3><dl class="kv">${P.info.map(i=>`<dt>${esc(i[0])}</dt><dd>${esc(i[1])}</dd>`).join('')}</dl></div>
      <p class="small">${esc(M.caption||'')}</p><button class="btn ghost" id="lr">Voir les régions</button>`,
    api=>$('#lr',api.el).addEventListener('click',()=>{api.close(true);regionsList();}),{tall:true});
  }
  w.addEventListener('click',e=>{
    const p=e.target.closest('.poi');if(p){poiSheet(p.dataset.p);return;}
    const g=e.target.closest('.reg');if(g)regionSheet(g.dataset.r);
  });
  w.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const p=e.target.closest('.poi'),g=e.target.closest('.reg');
    if(p){e.preventDefault();poiSheet(p.dataset.p);}else if(g){e.preventDefault();regionSheet(g.dataset.r);}
  });
  node.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='info')info();else regionsList();
  });
  $('#zi',node).addEventListener('click',()=>ctl.zoomIn());
  $('#zo',node).addEventListener('click',()=>ctl.zoomOut());
  $('#zr',node).addEventListener('click',()=>ctl.fit());
  return ()=>ctl.destroy();
};

/* =====================================================================
   ÉCRAN — paramètres
   ===================================================================== */
/* =====================================================================
   ÉCRAN — Dino Cristaux (jeu de plateforme 2D)
   Les 30 niveaux sont générés à partir de leur numéro : modifier WORLDS ou genLevel() pour les changer.
   ===================================================================== */
const NLEV=30,DH=14;
const WORLDS=[
 {name:'Prairies',sky:['#6ec6ff','#dff4ff'],hill:['#9bdca0','#74c383'],ground:'#8a5a34',top:'#52c24f',dark:'#6e4527',plat:'#c98f4f',slime:'#e0587a',cloud:true},
 {name:'Dunes',sky:['#ffab5e','#ffe8b3'],hill:['#f0c47e','#dba75f'],ground:'#c98f4f',top:'#f3d680',dark:'#a8723a',plat:'#8a5a34',slime:'#9a5ad8',cloud:true},
 {name:'Glaciers',sky:['#8fbdf5','#eef8ff'],hill:['#d7ebff','#bcd9f4'],ground:'#7aa6d6',top:'#f6fcff',dark:'#5f8bbd',plat:'#bfe0ff',slime:'#ff8a3d',cloud:true},
 {name:'Volcans',sky:['#2a0c14','#b23a20'],hill:['#5a1a1a','#3f1212'],ground:'#4a3030',top:'#e0502e',dark:'#2f1c1c',plat:'#8a5240',slime:'#3fb0ff',embers:true},
 {name:'Grottes de Cristal',sky:['#120a30','#3b2380'],hill:['#2a1b63','#201450'],ground:'#3c2f7a',top:'#9a82ff',dark:'#2a2060',plat:'#7a64d8',slime:'#ff5ac8',stars:true}
];
const DRAGON_COLORS=['#3fdc4a','#38b6ff','#ff5a5f','#a66bff','#ff9f2e','#ff7ac8','#ffd93b','#e8eef7'];
const GEMS=['#4ee3ff','#ff6bd6','#ffd84a','#8cff7a'];
const worldOf=n=>WORLDS[Math.floor((n-1)/6)];
const lvlLabel=n=>(Math.floor((n-1)/6)+1)+'-'+((n-1)%6+1);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genLevel(n){
  const rnd=mulberry(n*9973+17),R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const W=50+n*3,H=DH,g=Array.from({length:H},()=>Array(W).fill('.'));
  const crystals=[],enemies=[];
  let x=0,gy=10,cp=null,mid=false,last='';
  const maxGap=Math.min(5,2+Math.floor(n/7));
  const clampY=v=>Math.max(7,Math.min(11,v));
  const cr=(cx,cy)=>{if(cx>2&&cx<W-4)crystals.push({x:cx,y:cy,got:false});};
  const run=len=>{const s=x;for(let i=0;i<len&&x<W;i++){for(let r=gy;r<H;r++)g[r][x]='#';x++;}return s;};
  const line=(cx,k,cy)=>{for(let i=0;i<k;i++)cr(cx+i+.5,cy);};
  const start={x:2,y:gy-.8};
  run(7);
  while(x<W-14){
    if(!mid&&x>W/2){const s=run(6);cp={x:s+3,y:gy};mid=true;last='run';continue;}
    const opts=[['run',18],['step',15],['gap',22+n*.6],['plat',18],['spk',n>=3?10+n*.5:0],['pil',n>=6?8:0],['fly',n>=10?8:0]];
    let tot=0;opts.forEach(o=>tot+=o[1]);let v=rnd()*tot,kind='run';
    for(const o of opts){if(v<o[1]){kind=o[0];break;}v-=o[1];}
    if(kind==='gap'&&last==='gap')kind='run';
    last=kind;
    if(kind==='run'){
      const len=R(4,9),s=run(len);
      line(s+1,Math.min(len-2,R(2,5)),rnd()<.35?gy-2.5:gy-.5);
      if(len>=5&&n>=3&&rnd()<.35+n*.02)enemies.push({t:'walk',x:s+len/2,y:gy,a:s+1.2,b:s+len-1.2,dir:1,alive:true});
    }else if(kind==='step'){
      const d=(rnd()<.5?-1:1)*R(1,2);gy=clampY(gy+d);
      const s=run(R(3,6));line(s+1,Math.min(3,x-s-1),gy-.5);
    }else if(kind==='gap'){
      const w=R(2,maxGap),lim=w>3?1:2,ngy=clampY(gy+R(-lim,lim));
      for(let i=0;i<w;i++)if(w>=3||i<2)cr(x+i+.5,gy-1.2-Math.sin(Math.PI*(i+.5)/w)*2.2);
      x+=w;gy=ngy;const s=run(R(3,6));line(s+1,2,gy-.5);
    }else if(kind==='plat'){
      const L=R(8,11),s=run(L),cnt=2+(rnd()<.4?1:0),step=Math.floor((L-2)/cnt);
      for(let k=0;k<cnt;k++){const px=s+1+k*step,len=R(2,3);
        for(let i=0;i<len;i++){g[gy-2][px+i]='-';cr(px+i+.5,gy-2.5);}
        if(k===0&&n>=3&&rnd()<.6){const hx=px+1;for(let i=0;i<2;i++){g[gy-4][hx+i]='-';cr(hx+i+.5,gy-4.5);}}}
    }else if(kind==='spk'){
      const L=R(8,10),s=run(L),k=R(1,Math.min(3,1+Math.floor(n/8))),c0=s+3;
      for(let i=0;i<k;i++)g[gy-1][c0+i]='^';
      for(let i=0;i<k+2;i++)cr(c0-1+i+.5,gy-1.2-Math.sin(Math.PI*(i+.5)/(k+2))*2.2);
    }else if(kind==='pil'){
      const s=run(7),c0=s+3;g[gy-1][c0]='#';g[gy-2][c0]='#';
      cr(c0+.5,gy-3.5);line(s+1,1,gy-.5);line(s+5,1,gy-.5);
    }else if(kind==='fly'){
      const s=run(9);
      enemies.push({t:'fly',x:s+4.5,y:gy-3.2,cx:s+4.5,cy:gy-3.2,amp:2.5,ph:rnd()*6,alive:true});
      line(s+1,3,gy-.5);
    }
  }
  run(W-x);
  return {W,H,g,crystals,enemies,cp,exit:{x:W-4,y:gy},start};
}
function shade(hex,k){
  let h=String(hex).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16)||0,r=n>>16,g=n>>8&255,b=n&255,t=k<0?0:255,a=Math.abs(k),f=c=>Math.round(c+(t-c)*a);
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill();}
function drawDragon(c,x,y,s,color,o){
  o=o||{};const f=o.face||1,t=o.t||0,air=!!o.air,walk=o.walk||0;
  const dark=shade(color,-.3),light=shade(color,.38),belly=shade(color,.7);
  c.save();c.translate(x,y);c.scale(f*s,s);c.lineJoin='round';
  c.translate(0,-(air?0:Math.abs(Math.sin(t*12))*.045*walk));
  const wag=Math.sin(t*(walk?14:4))*.07;
  c.fillStyle=color;c.beginPath();c.moveTo(-.25,-.4);c.quadraticCurveTo(-.62,-.3+wag,-.68,-.64+wag);c.quadraticCurveTo(-.5,-.42,-.16,-.2);c.closePath();c.fill();
  c.fillStyle=dark;c.beginPath();c.moveTo(-.68,-.64+wag);c.lineTo(-.8,-.72+wag);c.lineTo(-.72,-.52+wag);c.closePath();c.fill();
  const fl=air?Math.sin(t*22)*.38:Math.sin(t*3)*.06;
  c.save();c.translate(-.06,-.6);c.rotate(-.5-fl);c.fillStyle=light;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-.2,-.36,-.52,-.34);c.quadraticCurveTo(-.42,-.2,-.38,-.1);c.quadraticCurveTo(-.28,-.14,-.22,-.02);c.quadraticCurveTo(-.12,.02,0,0);c.fill();c.restore();
  const l1=Math.sin(t*14)*.1*walk;c.fillStyle=dark;rr(c,-.22+l1,-.2,.18,.2,.07);rr(c,.06-l1,-.2,.18,.2,.07);
  c.fillStyle=dark;[-.28,-.1,.08].forEach(px=>{const yt=-.4-.33*Math.sqrt(Math.max(0,1-(px/.4)*(px/.4)));c.beginPath();c.moveTo(px-.075,yt+.04);c.lineTo(px,yt-.15);c.lineTo(px+.075,yt+.04);c.closePath();c.fill();});
  c.fillStyle=color;c.beginPath();c.ellipse(0,-.4,.4,.33,0,0,7);c.fill();
  c.fillStyle=belly;c.beginPath();c.ellipse(.05,-.3,.24,.2,0,0,7);c.fill();
  c.fillStyle=color;c.beginPath();c.ellipse(.2,-.64,.31,.27,0,0,7);c.fill();
  c.beginPath();c.ellipse(.46,-.56,.15,.11,0,0,7);c.fill();
  c.fillStyle=light;c.beginPath();c.moveTo(.06,-.86);c.lineTo(.1,-1.04);c.lineTo(.2,-.88);c.closePath();c.fill();
  c.beginPath();c.moveTo(.2,-.88);c.lineTo(.29,-1.02);c.lineTo(.35,-.84);c.closePath();c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(.3,-.7,.105,0,7);c.fill();
  c.fillStyle='#16122e';c.beginPath();c.arc(.33,-.69,.058,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(.345,-.71,.02,0,7);c.fill();
  c.fillStyle='rgba(255,90,120,.45)';c.beginPath();c.arc(.22,-.55,.05,0,7);c.fill();
  c.fillStyle=dark;c.beginPath();c.arc(.54,-.6,.02,0,7);c.fill();
  c.strokeStyle=dark;c.lineWidth=.025;c.beginPath();c.moveTo(.44,-.5);c.quadraticCurveTo(.52,-.47,.58,-.52);c.stroke();
  c.restore();
}
const IC_L='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 4l-10 8 10 8z"/></svg>',
      IC_R='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 4l10 8-10 8z"/></svg>',
      IC_U='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 10h-6v8H9v-8H3z"/></svg>',
      IC_F='<svg viewBox="0 0 24 24" fill="#ffb347"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>',
      IC_P='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
      IC_LOCK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>';
const stars3=s=>'<span class="dstars">'+'★'.repeat(s)+'<span class="off">'+'★'.repeat(3-s)+'</span></span>';

SCREENS.dino=node=>{
  const D=()=>me().dino;
  let stop=null;
  const unlocked=n=>D().all||n===1||(D().res[n-1]&&D().res[n-1].s>=1);
  node._esc=()=>{if(stop)menu();else goHome();};

  /* ---------- menu ---------- */
  function paintPreview(){
    const cv=$('#dpv',node);if(!cv)return;const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);
    drawDragon(c,126,200,128,D().color,{face:1,t:.4});
  }
  function menu(){
    if(stop){stop();stop=null;}
    const d=D();let got=0;Object.keys(d.res).forEach(k=>got+=d.res[k].s);
    node.innerHTML=appbar('Dino Cristaux',{sub:'★ '+got+' / '+NLEV*3})+`<div class="scroll">
      <div class="group"><h2>Ton dragon</h2><div class="dprev"><canvas id="dpv" width="224" height="224"></canvas><div class="ctrl">
        <div class="swatches" role="group" aria-label="Couleur du dragon">${DRAGON_COLORS.map(c=>`<button class="swt" style="--c:${c}" data-col="${c}" aria-pressed="${d.color===c}" aria-label="Couleur ${c}"></button>`).join('')}</div>
        <div class="field"><label for="dcol">Couleur personnalisée</label><input class="in" id="dcol" type="color" value="${d.color}" style="padding:4px"></div></div></div></div>
      ${WORLDS.map((w,wi)=>`<div class="group"><h2>${wi+1} · ${w.name}</h2><div class="lv-grid">${[1,2,3,4,5,6].map(k=>{
        const n=wi*6+k,lk=!unlocked(n),r=d.res[n];
        return `<button class="lv" data-lv="${n}" ${lk?'disabled':''} aria-label="Niveau ${wi+1}-${k}${lk?', verrouillé':r?', '+r.s+' étoiles':''}"><span>${wi+1}-${k}</span><small>${lk?IC_LOCK:'★'.repeat(r?r.s:0)+'☆'.repeat(3-(r?r.s:0))}</small></button>`;}).join('')}</div></div>`).join('')}
      <div class="group"><div class="sw"><span id="ual">Débloquer tous les niveaux</span><button role="switch" aria-checked="${!!d.all}" aria-labelledby="ual" id="uall"></button></div>
        <p class="small">Flèches ou A/D pour bouger, Espace ou W pour sauter (deux fois pour double saut), F pour le souffle de feu. Écrase les ennemis ou brûle-les. Récolte tous les cristaux pour 3 étoiles.</p></div>
    </div>`;
    paintPreview();
  }
  function setColor(c){D().color=c;save();$$('.swt',node).forEach(b=>b.setAttribute('aria-pressed',b.dataset.col===c));const i=$('#dcol',node);if(i)i.value=c;paintPreview();}
  node.addEventListener('click',e=>{
    const lvb=e.target.closest('[data-lv]');if(lvb){if(!lvb.disabled)play(+lvb.dataset.lv);return;}
    const sw=e.target.closest('[data-col]');if(sw){setColor(sw.dataset.col);return;}
    if(e.target.closest('#uall')){D().all=!D().all;save();menu();}
  });
  node.addEventListener('input',e=>{if(e.target.id==='dcol'){D().color=e.target.value;save();$$('.swt',node).forEach(b=>b.setAttribute('aria-pressed',false));paintPreview();}});

  /* ---------- jeu ---------- */
  function play(n){
    if(stop){stop();stop=null;}
    const lv=genLevel(n),wd=worldOf(n),d=D(),total=lv.crystals.length;
    const GRAV=38,JUMP=15,DJUMP=12.5,SPD=6.6;
    node.innerHTML=`<div class="dgame"><div class="dcv" id="dcv"><canvas id="dc"></canvas>
      <div class="dhud"><button class="ibtn" id="dback" aria-label="Menu des niveaux">${ICON.back}</button><span class="hud-pill" id="hlv">${esc(wd.name)} ${lvlLabel(n)}</span><span class="hud-pill" id="hcr"></span><span class="hud-pill" id="htm" style="margin-left:auto"></span><button class="ibtn" id="dpause" aria-label="Pause" style="width:38px;height:38px">${IC_P.replace('<svg','<svg width="18" height="18"')}</button></div></div>
      <div class="dctl"><div class="grp"><button class="dbtn" data-k="left" aria-label="Gauche">${IC_L}</button><button class="dbtn" data-k="right" aria-label="Droite">${IC_R}</button></div>

        <button class="btn" id="sw">Changer d'utilisateur</button></div>
      <div class="group"><h2>Affichage</h2>
        <div class="sw"><span id="cl">Réduire les animations</span><button role="switch" aria-checked="${!!state.calm}" aria-labelledby="cl" id="calm"></button></div></div>
      <div class="group"><h2>Sauvegarde</h2>
        <p class="small">Les données sont conservées dans ce navigateur. Copie-les pour les garder ou les transférer sur un autre appareil.</p>
        <textarea class="in" id="bk" rows="4" placeholder="La sauvegarde apparaît ici. Colle-y une sauvegarde pour la restaurer." aria-label="Sauvegarde"></textarea>
        <div class="row"><button class="btn ghost" id="exp">Préparer la sauvegarde</button><button class="btn ghost" id="imp">Restaurer</button></div><p class="msg" id="bm"></p></div>
      <div class="group"><h2>Mes données</h2><p class="small">Efface tes favoris et tes notes de région, sans toucher aux autres profils.</p><button class="btn danger" id="rst">Réinitialiser mes favoris et notes</button></div>
    </div>`;
    $$('.sym',node).forEach(b=>b.addEventListener('click',()=>{m.symbol=b.dataset.sym;m.photo=null;save();draw();}));
    $('#ph',node).addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;resizePhoto(f,d=>{if(d){m.photo=d;save();}draw();});});
    const rp=$('#rph',node);if(rp)rp.addEventListener('click',()=>{m.photo=null;save();draw();});
    $('#sw',node).addEventListener('click',()=>go('profiles'));
    $('#calm',node).addEventListener('click',()=>{state.calm=!state.calm;save();device.classList.toggle('calm',state.calm);draw();});
    const bk=$('#bk',node),bm=$('#bm',node);
    $('#exp',node).addEventListener('click',()=>{
      bk.value=JSON.stringify(state);bk.focus();bk.select();
      const ok=()=>{bm.textContent='Sauvegarde copiée.';},ko=()=>{bm.textContent='Sauvegarde prête : copie le texte ci-dessus.';};
      try{navigator.clipboard.writeText(bk.value).then(ok,ko);}catch(e){ko();}
    });
    const imp=$('#imp',node);
    twoStep(imp,'Confirmer : remplacer mes données',()=>{
      try{const s=JSON.parse(bk.value);if(!s||typeof s!=='object'||!s.users)throw 0;
        const keep=state.active;state=s;save();state=loadState();state.active=USERS.includes(keep)?keep:state.active;save();bm.textContent='Données restaurées.';draw();}
      catch(e){bm.textContent='Cette sauvegarde n\'est pas valide.';bm.style.color='var(--danger)';setTimeout(()=>{bm.style.color='';},2500);}
    });
    twoStep($('#rst',node),'Confirmer la réinitialisation',()=>{m.favSpells=[];m.favPotions=[];m.notes={};save();draw();$('#bm',node).textContent='Favoris et notes effacés.';});
  }
  draw();
};

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
device.classList.toggle('calm',!!state.calm);
go(state.active?'home':'profiles');
})();
</script>

</body></html>
